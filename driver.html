<!doctype html>
<html>
  <head>
    <title>Driver Dashboard</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
      }

      header {
        background-color: #1565c0;
        color: white;
        padding: 20px;
        text-align: center;
      }

      .container {
        width: 90%;
        margin: 30px auto;
      }

      .card {
        background-color: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px #ccc;
      }

      h2 {
        color: #333;
      }

      .details {
        line-height: 1.8;
        font-size: 17px;
      }

      .status {
        font-weight: bold;
        color: #d32f2f;
      }

      button {
        padding: 10px 18px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
      }

      .way {
        background-color: #f57c00;
      }

      .arrived {
        background-color: #388e3c;
      }

      .completed {
        background-color: #6a1b9a;
      }

      button:hover {
        opacity: 0.85;
      }

      #message {
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>🚑 Driver Dashboard</h1>

      <p>Assigned Emergency Requests</p>
    </header>

    <div class="container">
      <p id="message">Loading assigned requests...</p>

      <div id="requestContainer"></div>
    </div>

    <script>
      // ==================================================
      // LOAD ASSIGNED REQUESTS
      // ==================================================

      async function loadAssignedRequests() {
        try {
          const response = await fetch(
            "http://127.0.0.1:5000/api/emergency/driver-requests",
          );

          const requests = await response.json();

          const container = document.getElementById("requestContainer");

          container.innerHTML = "";

          if (requests.length === 0) {
            document.getElementById("message").innerText =
              "No assigned emergency requests.";

            return;
          }

          document.getElementById("message").innerText =
            "Assigned emergency requests";

          requests.forEach((request) => {
            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <h2>
                    🚨 Emergency Request #${request.id}
                </h2>

                <div class="details">

                    <b>Patient Name:</b>
                    ${request.patient_name}
                    <br>

                    <b>Phone:</b>
                    ${request.phone}
                    <br>

                    <b>Pickup Location:</b>
                    ${request.pickup_location}
                    <br>

                    <b>Hospital:</b>
                    ${request.hospital}
                    <br>

                    <b>Emergency Type:</b>
                    ${request.emergency_type}
                    <br>

                    <b>Ambulance:</b>
                    ${request.ambulance_number}
                    <br>

                    <b>Status:</b>

                    <span class="status">
                        ${request.status}
                    </span>

                </div>


                <br>


                <button
                    class="way"
                    onclick="updateStatus(${request.id}, 'ON THE WAY')">

                    🚑 On The Way

                </button>


                <button
                    class="arrived"
                    onclick="updateStatus(${request.id}, 'ARRIVED')">

                    📍 Arrived

                </button>


                <button
                    class="completed"
                    onclick="updateStatus(${request.id}, 'COMPLETED')">

                    ✅ Completed

                </button>

            `;

            container.appendChild(card);
          });
        } catch (error) {
          console.log(error);

          document.getElementById("message").innerText =
            "Cannot connect to backend server.";
        }
      }

      // ==================================================
      // UPDATE REQUEST STATUS
      // ==================================================

      async function updateStatus(requestId, status) {
        try {
          const response = await fetch(
            `http://127.0.0.1:5000/api/emergency/status/${requestId}`,

            {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                status: status,
              }),
            },
          );

          const data = await response.json();

          alert(data.message);

          if (response.ok) {
            loadAssignedRequests();
          }
        } catch (error) {
          console.log(error);

          alert("Cannot connect to backend server.");
        }
      }

      // ==================================================
      // LOAD DATA
      // ==================================================

      loadAssignedRequests();
    </script>
  </body>
</html>
